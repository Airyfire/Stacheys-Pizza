<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stachey's Pizza — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--color-bg);
    }

    .login-card {
      background: var(--color-bg-alt);
      border: 1px solid var(--color-line);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed var(--color-line);
      pointer-events: none;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .login-title {
      font-family: var(--font-serif);
      font-size: 32px;
      color: var(--color-ivory);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-accent-bright);
    }

    .login-form {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-ivory-dim);
    }

    .form-input {
      background: transparent;
      border: 1px solid var(--color-line);
      color: var(--color-ivory);
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--color-accent-bright);
      background: rgba(255, 255, 255, 0.02);
    }

    .login-btn {
      margin-top: 10px;
      width: 100%;
    }

    .login-error {
      color: #c44;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .login-error.is-visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Stachey's Portal</h1>
        <div class="login-subtitle">Authorization Required</div>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="password">Admin Password</label>
          <input class="form-input" type="password" id="password" required autofocus placeholder="••••••••">
        </div>
        <div class="login-error" id="loginError">Incorrect password</div>
        <button class="btn btn--accent login-btn" type="submit">Log In</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('password');
    const error = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.remove('is-visible');

      const password = input.value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/admin.html';
        } else {
          error.textContent = data.error || 'Incorrect password';
          error.classList.add('is-visible');
        }
      } catch (err) {
        error.textContent = 'Server connection failed';
        error.classList.add('is-visible');
      }
    });
  </script>
</body>

</html>
